<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKita — Ecommerce</title>
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --danger: #ef4444;
  --success: #10b981;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-500: #6b7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --white: #fff;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.6; }

/* Header */
.header { background: var(--white); box-shadow: var(--shadow); position: sticky; top:0; z-index:100; }
.header-inner { max-width:1200px; margin:0 auto; padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
.logo { font-size:1.5rem; font-weight:800; color:var(--primary); text-decoration:none; }
.logo span { color:var(--gray-900); }
.nav { display:flex; align-items:center; gap:1.5rem; }
.nav a { text-decoration:none; color:var(--gray-700); font-weight:500; font-size:.9rem; }
.nav a:hover { color:var(--primary); }
.cart-btn { position:relative; background:var(--primary); color:var(--white); border:none; padding:.6rem 1.2rem; border-radius:8px; cursor:pointer; font-weight:600; font-size:.9rem; }
.cart-btn:hover { background:var(--primary-dark); }
.cart-badge { position:absolute; top:-8px; right:-8px; background:var(--danger); color:var(--white); font-size:.7rem; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }

/* Main */
.main { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; }
.hero { background: linear-gradient(135deg, var(--primary), #7c3aed); color:var(--white); border-radius:16px; padding:3rem 2rem; margin-bottom:2rem; text-align:center; }
.hero h1 { font-size:2rem; margin-bottom:.5rem; }
.hero p { opacity:.9; font-size:1.1rem; }

/* Search */
.search-bar { display:flex; gap:.5rem; margin-bottom:2rem; }
.search-bar input { flex:1; padding:.75rem 1rem; border:2px solid var(--gray-200); border-radius:10px; font-size:1rem; outline:none; transition:.2s; }
.search-bar input:focus { border-color:var(--primary); }
.search-bar select { padding:.75rem 1rem; border:2px solid var(--gray-200); border-radius:10px; font-size:.9rem; background:var(--white); cursor:pointer; }

/* Products Grid */
.section-title { font-size:1.3rem; font-weight:700; margin-bottom:1rem; }
.products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1.5rem; }
.product-card { background:var(--white); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); transition:.2s; cursor:pointer; }
.product-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
.product-img { width:100%; height:200px; object-fit:cover; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-size:3rem; }
.product-body { padding:1rem; }
.product-category { font-size:.75rem; color:var(--primary); font-weight:600; text-transform:uppercase; }
.product-name { font-weight:600; margin:.25rem 0; font-size:1rem; }
.product-price { font-size:1.2rem; font-weight:800; color:var(--primary); }
.product-compare { font-size:.85rem; color:var(--gray-500); text-decoration:line-through; margin-left:.5rem; }
.product-stock { font-size:.8rem; color:var(--gray-500); margin-top:.25rem; }

/* Detail Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--white); border-radius:16px; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; padding:2rem; position:relative; }
.modal-close { position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--gray-500); }
.modal-img { width:100%; height:250px; object-fit:cover; border-radius:12px; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-size:5rem; margin-bottom:1rem; }
.modal h2 { margin-bottom:.5rem; }
.modal .price { font-size:1.5rem; font-weight:800; color:var(--primary); margin:.5rem 0; }
.modal .desc { color:var(--gray-500); margin-bottom:1.5rem; }
.qty-row { display:flex; align-items:center; gap:.5rem; margin-bottom:1rem; }
.qty-row button { width:36px; height:36px; border:2px solid var(--gray-200); border-radius:8px; background:var(--white); font-size:1.2rem; cursor:pointer; }
.qty-row input { width:60px; text-align:center; border:2px solid var(--gray-200); border-radius:8px; padding:.5rem; font-size:1rem; }
.btn { display:inline-block; padding:.75rem 1.5rem; border-radius:10px; font-weight:600; cursor:pointer; border:none; font-size:.95rem; transition:.2s; }
.btn-primary { background:var(--primary); color:var(--white); width:100%; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-outline { background:var(--white); color:var(--primary); border:2px solid var(--primary); }

/* Cart Sidebar */
.cart-sidebar { position:fixed; top:0; right:-400px; width:400px; height:100vh; background:var(--white); box-shadow:var(--shadow-lg); z-index:300; transition:.3s; display:flex; flex-direction:column; }
.cart-sidebar.open { right:0; }
.cart-sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:299; }
.cart-sidebar-overlay.open { display:block; }
.cart-header { padding:1.5rem; border-bottom:1px solid var(--gray-200); display:flex; justify-content:space-between; align-items:center; }
.cart-header h3 { font-size:1.2rem; }
.cart-list { flex:1; overflow-y:auto; padding:1rem 1.5rem; }
.cart-item { display:flex; gap:1rem; padding:1rem 0; border-bottom:1px solid var(--gray-100); }
.cart-item-img { width:60px; height:60px; border-radius:8px; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; }
.cart-item-info { flex:1; }
.cart-item-name { font-weight:600; font-size:.9rem; }
.cart-item-price { color:var(--primary); font-weight:600; font-size:.85rem; }
.cart-item-qty { display:flex; align-items:center; gap:.25rem; margin-top:.25rem; }
.cart-item-qty button { width:24px; height:24px; border:1px solid var(--gray-300); background:var(--white); border-radius:4px; cursor:pointer; }
.cart-item-remove { color:var(--danger); background:none; border:none; cursor:pointer; font-size:.8rem; margin-top:.25rem; }
.cart-footer { padding:1.5rem; border-top:1px solid var(--gray-200); }
.cart-total { display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; margin-bottom:1rem; }
.empty-cart { text-align:center; padding:3rem 1rem; color:var(--gray-500); }
.empty-cart .icon { font-size:3rem; margin-bottom:1rem; }

/* Toast */
.toast { position:fixed; bottom:2rem; right:2rem; background:var(--gray-900); color:var(--white); padding:.75rem 1.5rem; border-radius:10px; font-weight:500; z-index:400; animation:slideUp .3s; }
@keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* Auth */
.auth-section { display:none; }
.auth-section.active { display:block; }
.auth-form { max-width:400px; margin:2rem auto; background:var(--white); padding:2rem; border-radius:12px; box-shadow:var(--shadow); }
.auth-form h2 { margin-bottom:1.5rem; text-align:center; }
.form-group { margin-bottom:1rem; }
.form-group label { display:block; font-size:.85rem; font-weight:600; margin-bottom:.25rem; }
.form-group input { width:100%; padding:.65rem .75rem; border:2px solid var(--gray-200); border-radius:8px; font-size:.95rem; }
.form-group input:focus { outline:none; border-color:var(--primary); }
.user-info { display:flex; align-items:center; gap:.5rem; }
.user-avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--white); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; }
.logout-btn { background:none; border:1px solid var(--gray-300); padding:.4rem .8rem; border-radius:6px; cursor:pointer; font-size:.8rem; color:var(--gray-700); }

/* Orders */
.orders-list { display:flex; flex-direction:column; gap:1rem; }
.order-card { background:var(--white); border-radius:12px; padding:1.5rem; box-shadow:var(--shadow); }
.order-header { display:flex; justify-content:space-between; margin-bottom:.75rem; }
.order-number { font-weight:700; }
.order-status { padding:.2rem .6rem; border-radius:20px; font-size:.75rem; font-weight:600; }
.status-pending { background:#fef3c7; color:#92400e; }
.status-paid { background:#dbeafe; color:#1e40af; }
.status-processing { background:#e0e7ff; color:#3730a3; }
.status-shipped { background:#d1fae5; color:#065f46; }
.status-delivered { background:#d1fae5; color:#065f46; }
.status-cancelled { background:#fee2e2; color:#991b1b; }
.order-meta { font-size:.85rem; color:var(--gray-500); display:flex; gap:1.5rem; }
.order-items { margin-top:.75rem; font-size:.9rem; }
.order-items div { padding:.25rem 0; }

.tabs { display:flex; gap:.5rem; margin-bottom:1.5rem; border-bottom:2px solid var(--gray-200); }
.tab { padding:.75rem 1.5rem; cursor:pointer; font-weight:500; color:var(--gray-500); border-bottom:2px solid transparent; margin-bottom:-2px; transition:.2s; }
.tab:hover { color:var(--gray-700); }
.tab.active { color:var(--primary); border-bottom-color:var(--primary); }
.tab-content { display:none; }
.tab-content.active { display:block; }

.checkout-form { max-width:500px; }
.checkout-form textarea { width:100%; padding:.65rem; border:2px solid var(--gray-200); border-radius:8px; resize:vertical; min-height:80px; }

@media (max-width:768px) {
  .cart-sidebar { width:100%; right:-100%; }
  .hero { padding:2rem 1rem; }
  .hero h1 { font-size:1.5rem; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="showPage('home')">🛒 Toko<span>Kita</span></a>
    <nav class="nav">
      <a href="#" onclick="showPage('home')">Home</a>
      <a href="#" onclick="showPage('orders')">Pesanan Saya</a>
      <div id="authArea"></div>
      <button class="cart-btn" onclick="toggleCart()">🛒 Keranjang <span class="cart-badge" id="cartBadge">0</span></button>
    </nav>
  </div>
</header>

<!-- Cart Sidebar -->
<div class="cart-sidebar-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3>🛒 Keranjang Belanja</h3>
    <button onclick="toggleCart()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">✕</button>
  </div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-footer" id="cartFooter">
    <div class="cart-total"><span>Total</span> <span id="cartTotal">Rp 0</span></div>
    <button class="btn btn-primary" onclick="checkout()" id="checkoutBtn">Checkout →</button>
  </div>
</div>

<!-- Main Content -->
<main class="main" id="mainContent"></main>

<!-- Product Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal" id="productModalContent"></div>
</div>

<!-- Toast Container -->
<div id="toastContainer"></div>

<script>
// ============================================================
// STATE
// ============================================================
const API_BASE = 'http://localhost:3000/api';
let currentPage = 'home';
let token = localStorage.getItem('token');
let user = JSON.parse(localStorage.getItem('user') || 'null');
let cart = JSON.parse(localStorage.getItem('cart') || '[]');

// ============================================================
// AUTH
// ============================================================
function renderAuth() {
  const area = document.getElementById('authArea');
  if (user) {
    area.innerHTML = `
      <div class="user-info">
        <div class="user-avatar">${user.full_name?.[0] || 'U'}</div>
        <span style="font-size:.85rem;font-weight:500;">${user.full_name || user.email}</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>`;
  } else {
    area.innerHTML = `<a href="#" onclick="showPage('login')" style="font-weight:600;">Login</a>`;
  }
}

async function login(email, password) {
  const res = await fetch(`${API_BASE}/auth/login`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message);
  token = data.data.accessToken;
  user = data.data.user;
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(user));
  renderAuth();
  showPage('home');
  toast('Login berhasil! 🎉');
}

async function register(email, password, fullName) {
  const res = await fetch(`${API_BASE}/auth/register`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password, fullName})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message);
  token = data.data.accessToken;
  user = data.data.user;
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(user));
  renderAuth();
  showPage('home');
  toast('Registrasi berhasil! Selamat datang 🎉');
}

function logout() {
  token = null; user = null; cart = [];
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  localStorage.removeItem('cart');
  renderAuth();
  updateCartBadge();
  showPage('home');
}

function authFetch(url, opts={}) {
  const headers = {...opts.headers, 'Content-Type':'application/json'};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  return fetch(url, {...opts, headers});
}

// ============================================================
// PRODUCTS
// ============================================================
async function loadProducts(search='', category='', page=1) {
  const params = new URLSearchParams({page, limit:20});
  if (search) params.set('search', search);
  if (category) params.set('categoryId', category);
  try {
    const res = await fetch(`${API_BASE}/products?${params}`);
    return await res.json();
  } catch { return { data:[], pagination:{total:0} }; }
}

async function loadCategories() {
  try {
    const res = await fetch(`${API_BASE}/products?limit=100`);
    const data = await res.json();
    const cats = new Map();
    (data.data||[]).forEach(p => {
      if (p.category_name) cats.set(p.category_id, p.category_name);
    });
    return Array.from(cats, ([id,name]) => ({id,name}));
  } catch { return []; }
}

// ============================================================
// CART
// ============================================================
function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  const count = cart.reduce((s,i) => s+i.quantity, 0);
  badge.textContent = count;
}

function addToCart(product, quantity=1) {
  const existing = cart.find(i => i.product_id === product.id);
  if (existing) {
    existing.quantity += quantity;
  } else {
    cart.push({
      product_id: product.id,
      product_name: product.name,
      price: product.price,
      image_url: product.image_url,
      quantity
    });
  }
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  renderCart();
  toast(`${product.name} ditambahkan ke keranjang ✅`);
}

function updateCartItem(productId, quantity) {
  const idx = cart.findIndex(i => i.product_id === productId);
  if (idx === -1) return;
  if (quantity <= 0) { cart.splice(idx, 1); }
  else { cart[idx].quantity = quantity; }
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  renderCart();
}

function removeCartItem(productId) {
  cart = cart.filter(i => i.product_id !== productId);
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  renderCart();
}

function cartTotal() {
  return cart.reduce((s,i) => s + (i.price * i.quantity), 0);
}

function toggleCart() {
  document.getElementById('cartSidebar').classList.toggle('open');
  document.getElementById('cartOverlay').classList.toggle('open');
  renderCart();
}

function renderCart() {
  const list = document.getElementById('cartList');
  if (cart.length === 0) {
    list.innerHTML = `<div class="empty-cart"><div class="icon">🛒</div><p>Keranjang kosong</p></div>`;
  } else {
    list.innerHTML = cart.map(i => `
      <div class="cart-item">
        <div class="cart-item-img">📦</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${esc(i.product_name)}</div>
          <div class="cart-item-price">Rp ${fmt(i.price)}</div>
          <div class="cart-item-qty">
            <button onclick="updateCartItem('${i.product_id}', ${i.quantity-1})">−</button>
            <span>${i.quantity}</span>
            <button onclick="updateCartItem('${i.product_id}', ${i.quantity+1})">+</button>
          </div>
          <button class="cart-item-remove" onclick="removeCartItem('${i.product_id}')">Hapus</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('cartTotal').textContent = `Rp ${fmt(cartTotal())}`;
  document.getElementById('checkoutBtn').disabled = cart.length === 0;
}

async function checkout() {
  if (!user) { toast('Silakan login dulu!'); showPage('login'); return; }
  if (cart.length === 0) { toast('Keranjang kosong!'); return; }
  
  try {
    const res = await authFetch(`${API_BASE}/checkout`, {
      method:'POST',
      body: JSON.stringify({ notes: '' })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);
    cart = [];
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    renderCart();
    toggleCart();
    toast(`Order #${data.data.order_number} dibuat! 🎉`);
    showPage('orders');
  } catch(e) {
    toast('Checkout gagal: ' + e.message);
  }
}

// ============================================================
// ORDERS
// ============================================================
async function loadOrders() {
  try {
    const res = await authFetch(`${API_BASE}/orders?limit=50`);
    const data = await res.json();
    return data.data || [];
  } catch { return []; }
}

// ============================================================
// PAGES
// ============================================================
async function showPage(page) {
  currentPage = page;
  const main = document.getElementById('mainContent');
  
  if (page === 'home') {
    const categories = await loadCategories();
    main.innerHTML = `
      <div class="hero">
        <h1>🛍️ Belanja Mudah, Harga Terbaik</h1>
        <p>Produk berkualitas dengan pengiriman cepat ke seluruh Indonesia</p>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Cari produk..." oninput="showHomeProducts()">
        <select id="categoryFilter" onchange="showHomeProducts()">
          <option value="">Semua Kategori</option>
          ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
      </div>
      <div class="section-title">Produk Terbaru</div>
      <div class="products-grid" id="productsGrid">Loading...</div>
    `;
    showHomeProducts();
  }
  
  else if (page === 'login') {
    main.innerHTML = `
      <div class="auth-form">
        <h2>🔐 Login</h2>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="email@example.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="Min. 8 karakter"></div>
        <button class="btn btn-primary" onclick="handleLogin()">Login</button>
        <p style="text-align:center;margin-top:1rem;font-size:.9rem;">Belum punya akun? <a href="#" onclick="showPage('register')" style="color:var(--primary);">Daftar</a></p>
      </div>`;
  }
  
  else if (page === 'register') {
    main.innerHTML = `
      <div class="auth-form">
        <h2>📝 Daftar</h2>
        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="regName" placeholder="Nama Anda"></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="email@example.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="regPass" placeholder="Min. 8 karakter"></div>
        <button class="btn btn-primary" onclick="handleRegister()">Daftar</button>
        <p style="text-align:center;margin-top:1rem;font-size:.9rem;">Sudah punya akun? <a href="#" onclick="showPage('login')" style="color:var(--primary);">Login</a></p>
      </div>`;
  }
  
  else if (page === 'orders') {
    if (!user) { toast('Silakan login dulu!'); showPage('login'); return; }
    main.innerHTML = `<div class="section-title">📋 Pesanan Saya</div><div class="orders-list" id="ordersList">Loading...</div>`;
    showOrders();
  }
}

async function showHomeProducts() {
  const search = document.getElementById('searchInput')?.value || '';
  const category = document.getElementById('categoryFilter')?.value || '';
  const grid = document.getElementById('productsGrid');
  if (!grid) return;
  try {
    const data = await loadProducts(search, category);
    if (!data.data || data.data.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--gray-500);">Tidak ada produk ditemukan.</p>';
      return;
    }
    grid.innerHTML = data.data.map(p => `
      <div class="product-card" onclick="showProductDetail('${p.id}')">
        <div class="product-img">📦</div>
        <div class="product-body">
          ${p.category_name ? `<div class="product-category">${p.category_name}</div>` : ''}
          <div class="product-name">${esc(p.name)}</div>
          <div class="product-price">
            Rp ${fmt(p.price)}
            ${p.compare_at_price ? `<span class="product-compare">Rp ${fmt(p.compare_at_price)}</span>` : ''}
          </div>
          <div class="product-stock">Stok: ${p.stock}</div>
        </div>
      </div>`).join('');
  } catch {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--gray-500);">Gagal memuat produk. Pastikan server berjalan.</p>';
  }
}

async function showProductDetail(id) {
  try {
    const res = await fetch(`${API_BASE}/products/${id}`);
    const data = await res.json();
    if (!res.ok) throw new Error('Produk tidak ditemukan');
    const p = data.data;
    const modal = document.getElementById('productModalContent');
    modal.innerHTML = `
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-img">📦</div>
      <h2>${esc(p.name)}</h2>
      ${p.category_name ? `<div class="product-category">${p.category_name}</div>` : ''}
      <div class="price">Rp ${fmt(p.price)} ${p.compare_at_price ? `<span style="font-size:1rem;text-decoration:line-through;color:var(--gray-500);">Rp ${fmt(p.compare_at_price)}</span>` : ''}</div>
      <div class="desc">${esc(p.description || 'Tidak ada deskripsi.')}</div>
      <div style="color:var(--gray-500);margin-bottom:1rem;">Stok tersedia: <strong>${p.stock}</strong></div>
      <div class="qty-row">
        <button onclick="changeModalQty(-1)">−</button>
        <input type="number" id="modalQty" value="1" min="1" max="${p.stock}" readonly>
        <button onclick="changeModalQty(1)">+</button>
      </div>
      <button class="btn btn-primary" onclick="addToCartFromModal('${p.id}')">🛒 Tambah ke Keranjang</button>
    `;
    document.getElementById('productModal').classList.add('active');
    window._modalProduct = p;
  } catch(e) {
    toast('Gagal memuat produk');
  }
}

function changeModalQty(delta) {
  const input = document.getElementById('modalQty');
  const max = window._modalProduct?.stock || 99;
  let val = parseInt(input.value) + delta;
  if (val < 1) val = 1;
  if (val > max) val = max;
  input.value = val;
}

function addToCartFromModal(id) {
  const qty = parseInt(document.getElementById('modalQty').value);
  addToCart(window._modalProduct, qty);
  closeModal();
}

function closeModal() {
  document.getElementById('productModal').classList.remove('active');
}

async function showOrders() {
  const list = document.getElementById('ordersList');
  if (!list) return;
  const orders = await loadOrders();
  if (orders.length === 0) {
    list.innerHTML = '<div class="empty-cart"><div class="icon">📭</div><p>Belum ada pesanan.</p></div>';
    return;
  }
  list.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-header">
        <div class="order-number">#${o.order_number}</div>
        <div class="order-status status-${o.status}">${o.status}</div>
      </div>
      <div class="order-meta">
        <span>Total: <strong>Rp ${fmt(o.total_amount)}</strong></span>
        <span>${new Date(o.created_at).toLocaleDateString('id-ID')}</span>
      </div>
      ${o.items ? `<div class="order-items">${o.items.map(i => `<div>${i.quantity}x ${esc(i.product_name)} — Rp ${fmt(i.subtotal)}</div>`).join('')}</div>` : ''}
    </div>`).join('');
}

// ============================================================
// HANDLERS
// ============================================================
async function handleLogin() {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  try { await login(email, pass); } catch(e) { toast(e.message); }
}

async function handleRegister() {
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const pass = document.getElementById('regPass').value;
  try { await register(email, pass, name); } catch(e) { toast(e.message); }
}

// ============================================================
// UTILS
// ============================================================
function fmt(n) { return Number(n).toLocaleString('id-ID'); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toast(msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ============================================================
// INIT
// ============================================================
renderAuth();
updateCartBadge();
showPage('home');
</script>
</body>
</html>
